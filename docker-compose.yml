services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

  db:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: unbounded
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: ["redis-server", "--appendonly", "yes"]


  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ingestion
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["poetry", "run", "python", "-m", "app.services.ingestion.ingest_odds_api"]

  ev_calculator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ev_calculator
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["poetry", "run", "python", "-m", "app.services.ingestion.ev_calculator"]

  arb_scanner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arb_scanner
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: ["poetry", "run", "python", "-m", "app.workers.arb_scanner"]
volumes:
  pgdata:
  redisdata:
